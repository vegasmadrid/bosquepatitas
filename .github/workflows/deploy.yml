name: Deploy to Webempresa
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Deploy via Git-FTP
      run: |
        sudo apt update && sudo apt install -y git-ftp
        git config git-ftp.url "ftpes://213.158.84.67:21/"
        git config git-ftp.user "${{ secrets.FTP_USERNAME }}"
        git config git-ftp.password "${{ secrets.FTP_PASSWORD }}"
        git ftp push --auto-init --insecure

name: Deploy to Webempresa
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Deploy via LFTP
      env:
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt update && sudo apt install -y lftp
        lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-force true; set ssl:verify-certificate no; set ftp:passive-mode true; mirror -R --verbose --exclude .git/ --exclude .github/ . /wp-content/plugins/bosque-patitas/; quit" 213.158.84.67

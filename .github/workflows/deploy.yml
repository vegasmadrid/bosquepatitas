name: Deploy to Webempresa
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Deploy via Git-FTP
      run: |
        sudo apt update && sudo apt install -y git-ftp
        git ftp push --auto-init --insecure -u "${{ secrets.FTP_USERNAME }}" -p "${{ secrets.FTP_PASSWORD }}" ftps://ftp.bosquepatitas.com/

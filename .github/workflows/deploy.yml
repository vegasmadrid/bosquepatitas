name: Deploy via cPanel API
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  cpanel-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger cPanel Git Pull
      run: |
        curl -k -s -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASS }}" \
          "https://cp7132.webempresa.eu:2443/execute/VersionControl/update?name=bosque-patitas&repository_root=%2Fhome%2Fmusicae1%2Fpublic_html%2Fbosquepatitas.com%2Fwp-content%2Fplugins%2Fbosque-patitas"

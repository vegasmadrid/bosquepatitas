name: Deploy to Webempresa
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Deploy via LFTP
      run: |
        sudo apt update && sudo apt install -y lftp
        lftp -c "
        set ftp:ssl-force true;
        set ssl:verify-certificate no;
        set ftp:passive-mode true;
        open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' 213.158.84.67;
        mirror -R --verbose --exclude .git/ --exclude .github/ . /wp-content/plugins/bosque-patitas/
        "

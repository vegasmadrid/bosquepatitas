name: Deploy to Webempresa
on:
  push:
    branches:
      - main
      - 'jules-*'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Diagnostico de conexion FTP
      env:
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        echo "=== 1. VERIFICACIÓN DE SECRETOS ==="
        echo "Longitud del usuario: ${#FTP_USER} caracteres"
        echo "Longitud de la clave: ${#FTP_PASS} caracteres"
        
        if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
          echo "ERROR: Uno o ambos Secretos están vacíos en GitHub."
          exit 1
        fi

        echo "=== 2. RESPUESTA DETALLADA DEL SERVIDOR (CURL) ==="
        curl -v --ftp-ssl --insecure -u "$FTP_USER:$FTP_PASS" "ftp://213.158.84.67:21/" --list-only
